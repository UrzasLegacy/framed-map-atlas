name: Build site.zip

on:
  push:
    branches: ['**']
    paths:
      - 'website/**'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build site.zip
        run: python3 website/build_archives.py site

      - name: Upload site.zip
        uses: actions/upload-artifact@v7
        with:
          path: site.zip
          archive: false
          if-no-files-found: error
